<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Camera | EcoSort AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">♻</span>
        <span>EcoSort <b>AI</b></span>
    </a>

    <button class="menu-toggle"
            onclick="document.querySelector('.main-nav').classList.toggle('open')">
        ☰
    </button>

    <nav class="main-nav">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('classify') }}">Classify</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('reports') }}">Report</a>
    </nav>
</header>

<main class="container narrow">
    <a class="back-link" href="{{ url_for('home') }}">← Back to dashboard</a>

    <section class="page-heading">
        <p class="eyebrow">CAMERA CLASSIFICATION</p>
        <h1>Capture a waste item</h1>
        <p>Allow camera access, position one waste item in view, and capture an image.</p>
    </section>

    <section class="panel camera-panel">
        <video id="camera-video" autoplay playsinline></video>
        <canvas id="camera-canvas" hidden></canvas>

        <form action="{{ url_for('camera') }}" method="POST" id="camera-form">
            <input type="hidden" name="camera_image" id="camera-image">
            <div class="button-row">
                <button type="button" class="btn btn-secondary" id="start-camera">Start Camera</button>
                <button type="button" class="btn btn-secondary" id="capture-button" disabled>Capture Photo</button>
                <button type="submit" class="btn btn-primary" id="analyse-button" disabled>Analyse Photo</button>
            </div>
        </form>

        <p id="camera-message" class="muted">Click Start Camera to begin.</p>
        <img id="captured-preview" class="captured-preview" alt="Captured image" hidden>
    </section>
</main>

<script>
const video = document.getElementById("camera-video");
const canvas = document.getElementById("camera-canvas");
const imageField = document.getElementById("camera-image");
const startButton = document.getElementById("start-camera");
const captureButton = document.getElementById("capture-button");
const analyseButton = document.getElementById("analyse-button");
const message = document.getElementById("camera-message");
const preview = document.getElementById("captured-preview");

let cameraStream = null;

startButton.addEventListener("click", async () => {
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
        });
        video.srcObject = cameraStream;
        captureButton.disabled = false;
        message.textContent = "Camera is ready. Position the item and capture it.";
    } catch (error) {
        message.textContent = "Unable to access the camera. Check browser permissions.";
    }
});

captureButton.addEventListener("click", () => {
    if (!video.videoWidth) {
        message.textContent = "Wait for the camera to start.";
        return;
    }
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
    imageField.value = dataUrl;
    preview.src = dataUrl;
    preview.hidden = false;
    analyseButton.disabled = false;
    message.textContent = "Photo captured. Click Analyse Photo.";
});

document.getElementById("camera-form").addEventListener("submit", () => {
    if (!imageField.value) {
        message.textContent = "Capture a photo before analysing.";
    }
});

window.addEventListener("beforeunload", () => {
    if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
});
</script>
</body>
</html>
